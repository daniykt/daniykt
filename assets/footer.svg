<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-label="never fade away — see you on the net, choom">
<title>daniykt — edgerunner footer</title>
<style>
text { font-family: 'JetBrains Mono','Fira Code','DejaVu Sans Mono',Menlo,Consolas,monospace; }
.bg    { fill: #0a0a0f; }
.dim   { fill: #5c5c6e; font-size: 11px; letter-spacing: 1px; }
.mag   { fill: #FF003C; }
.sub   { fill: #9a9ab0; font-size: 14px; letter-spacing: .5px; }
.title { font-size: 64px; font-weight: 800; letter-spacing: 4px; }
.main  { fill: #FCEE09; }
.gr    { fill: #FF003C; opacity: 0; mix-blend-mode: screen; animation: g1 4s infinite steps(1); }
.gc    { fill: #00F0FF;    opacity: 0; mix-blend-mode: screen; animation: g2 4s infinite steps(1); }
.s1    { fill: #FCEE09;  opacity: 0; animation: s1 4s infinite steps(1); }
.s2    { fill: #FCEE09;  opacity: 0; animation: s2 4s infinite steps(1); }
.jit   { animation: jit 4s infinite steps(1); }
.blink { animation: blink 1s infinite steps(1); }
@keyframes g1  { 0%,79%,100%{opacity:0;transform:none} 80%{opacity:.9;transform:translate(-6px,1px)} 83%{opacity:.9;transform:translate(4px,-1px)} 86%{opacity:.7;transform:translate(-3px,0)} 90%{opacity:0} }
@keyframes g2  { 0%,79%,100%{opacity:0;transform:none} 80%{opacity:.9;transform:translate(6px,-1px)} 83%{opacity:.9;transform:translate(-4px,1px)} 86%{opacity:.7;transform:translate(3px,0)} 90%{opacity:0} }
@keyframes s1  { 0%,81%,88%,100%{opacity:0;transform:none} 82%{opacity:1;transform:translate(14px,0)} 85%{opacity:1;transform:translate(-8px,0)} }
@keyframes s2  { 0%,83%,90%,100%{opacity:0;transform:none} 84%{opacity:1;transform:translate(-12px,0)} 87%{opacity:1;transform:translate(6px,0)} }
@keyframes jit { 0%,79%,91%,100%{transform:none} 81%{transform:translate(2px,0) skewX(-6deg)} 85%{transform:translate(-3px,0)} 89%{transform:translate(1px,0) skewX(4deg)} }
@keyframes blink { 50% { opacity: 0; } }
</style>
<defs>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
<rect width="4" height="2" fill="#000" opacity=".28"/>
</pattern>
<clipPath id="slice1"><rect x="0" y="46" width="900" height="14"/></clipPath>
<clipPath id="slice2"><rect x="0" y="70" width="900" height="10"/></clipPath>
</defs>
<rect class="bg" width="900" height="150" rx="14"/>
<text x="22" y="26" class="dim">// END_OF_TRANSMISSION</text>
<text x="878" y="26" class="dim" text-anchor="end">SIGNAL ▸ <tspan class="mag blink">●</tspan> LIVE</text>
<g class="jit">
  <g class="gr"><text x="450.0" y="88" class="title" text-anchor="middle">NEVER FADE AWAY</text></g>
  <g class="gc"><text x="450.0" y="88" class="title" text-anchor="middle">NEVER FADE AWAY</text></g>
  <g class="main"><text x="450.0" y="88" class="title" text-anchor="middle">NEVER FADE AWAY</text></g>
  <g clip-path="url(#slice1)"><g class="s1"><text x="450.0" y="88" class="title" text-anchor="middle">NEVER FADE AWAY</text></g></g>
  <g clip-path="url(#slice2)"><g class="s2"><text x="450.0" y="88" class="title" text-anchor="middle">NEVER FADE AWAY</text></g></g>
</g>
<text x="450.0" y="124" class="sub" text-anchor="middle">the ones who do go legend <tspan class="mag">·</tspan> see you on the net, choom</text>
<rect width="900" height="150" fill="url(#scan)" pointer-events="none"/>

</svg>
