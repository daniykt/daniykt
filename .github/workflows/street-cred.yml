name: Street cred

on:
  schedule: # todo dia às 09:23 UTC
    - cron: "23 9 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/street-cred.yml"

permissions:
  contents: write

jobs:
  street-cred:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: gerar street-cred.svg
        env:
          # GH_STATS_TOKEN é opcional: um PAT com escopo read:user. Com ele as
          # contribuições privadas entram na contagem; sem ele, o GITHUB_TOKEN
          # padrão do Actions só enxerga as públicas.
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/gen_street_cred.py

      - name: commitar se o svg mudou
        run: |
          if git diff --quiet -- assets/street-cred.svg; then
            echo "street-cred.svg sem mudança"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/street-cred.svg
          git commit -m "chore: atualizar street-cred.svg"
          git pull --rebase
          git push
